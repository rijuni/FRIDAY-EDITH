# ==============================================================================
# F.R.I.D.A.Y. & E.D.I.T.H. Production Reverse Proxy Configuration (Nginx)
# Supports:
# 1. 1 GiB streaming attachments without disk exhaustion (proxy_request_buffering off)
# 2. SSE chat and reasoning stream proxying without buffering (proxy_buffering off)
# 3. Microservice routing for Web UI (:5173), API Gateway (:3000), Friday AI (:8001),
#    Edith Engine (:8002), and Runner Host (:8003).
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Global upload size limit: 1 GiB (P1 INGEST-01)
    client_max_body_size 1024m;

    # Upstream Microservice Definitions
    upstream web_upstream {
        server 127.0.0.1:5173;
        keepalive 32;
    }

    upstream api_upstream {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    upstream friday_ai_upstream {
        server 127.0.0.1:8001;
        keepalive 16;
    }

    upstream edith_engine_upstream {
        server 127.0.0.1:8002;
        keepalive 16;
    }

    upstream runner_host_upstream {
        server 127.0.0.1:8003;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # In production, redirect HTTP to HTTPS:
        # return 301 https://$host$request_uri;

        # ----------------------------------------------------------------------
        # Security Headers
        # ----------------------------------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ----------------------------------------------------------------------
        # Health Probe Endpoint
        # ----------------------------------------------------------------------
        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }

        # ----------------------------------------------------------------------
        # High-Volume 1 GiB Streaming Uploads
        # Disables disk request buffering so bytes stream straight to API/ClamAV
        # ----------------------------------------------------------------------
        location ~* ^/v1/friday/conversations/[^/]+/attachments/upload {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Disable client request buffering for real-time 1 GiB streaming
            proxy_request_buffering off;
            proxy_buffering off;
            client_max_body_size 1024m;

            # Extended 900s timeout for large file transmissions
            proxy_connect_timeout 30s;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-File-Mime-Type $http_x_file_mime_type;
        }

        # ----------------------------------------------------------------------
        # Server-Sent Events (SSE) Streaming Endpoints (F.R.I.D.A.Y. Chat & Thinking)
        # ----------------------------------------------------------------------
        location ~* ^/v1/friday/conversations/[^/]+/messages {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Disable proxy response buffering so SSE chunks flush immediately
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Keep connection open for long-lived LLM reasoning streams
            proxy_connect_timeout 30s;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
        }

        # ----------------------------------------------------------------------
        # General API Gateway (/v1/)
        # ----------------------------------------------------------------------
        location /v1/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            proxy_connect_timeout 15s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ----------------------------------------------------------------------
        # Web UI (Vite / SPA) & WebSocket HMR Support
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
