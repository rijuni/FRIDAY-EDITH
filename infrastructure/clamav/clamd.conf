# ==============================================================================
# ClamAV Daemon Configuration (clamd.conf) for F.R.I.D.A.Y. & E.D.I.T.H.
# Configured for 1 GiB streaming malware inspection (P1 INGEST-01, Audit Finding 3.2)
# ==============================================================================

# TCP Socket Binding for Node.js clamd client
TCPSocket 3310
TCPAddr 127.0.0.1

# Connection and Concurrency Limits
MaxConnectionQueueLength 100
MaxThreads 10
CommandReadTimeout 120
SendBufTimeout 300

# ------------------------------------------------------------------------------
# File Size & Stream Limits (1 GiB = 1073741824 bytes)
# Must match API and Nginx reverse proxy ingestion boundaries
# ------------------------------------------------------------------------------
StreamMaxLength 1073741824
MaxFileSize 1073741824
MaxScanSize 1073741824

# Archive & Recursion Hardening
MaxRecursion 16
MaxFiles 10000
MaxEmbeddedPE 104857600
MaxHTMLNormalize 104857600
MaxHTMLNoTags 20971520
MaxScriptNormalize 52428800
MaxZipTypeRcg 104857600

# Detection & Scan Engine Options
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanArchive yes
AlertBrokenExecutables yes
AlertEncrypted yes
AlertEncryptedDoc yes
AlertEncryptedArchive yes
ExtendedDetectionInfo yes

# Operational Settings
Foreground no
Debug no
LeaveTemporaryFiles no
User clamav
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 60000
